<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>カード帳</title>
<style>
*{box-sizing:border-box}html,body{height:auto}body{padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:linear-gradient(145deg,#fffaff,#f7f2ff,#eef8ff);color:#514352}button,input,select,textarea{font:inherit}button{cursor:pointer}
header{padding:18px 18px 14px;background:linear-gradient(180deg,#fffaff,#f7f1ff);display:flex;align-items:center;gap:14px;border-bottom:1px solid #eadcf3;position:sticky;top:0;z-index:10;padding-top:calc(18px + env(safe-area-inset-top,0px))}.logo{width:64px;height:64px;border-radius:20px;background:linear-gradient(145deg,#f7b8d9,#cbb9ed);display:grid;place-items:center;color:white;font-size:31px;box-shadow:0 7px 18px #c9b9e530}.headtext{flex:1}.eyebrow{font-size:12px;letter-spacing:.22em;color:#987da9;font-weight:800}.headtext h1{margin:5px 0 0;font-size:24px;letter-spacing:.02em;color:#4b4353}.gear{width:56px;height:56px;border-radius:50%;background:#fff;border:1px solid #e7dff0;color:#9888a8;font-size:25px}
.wrap{max-width:900px;margin:auto;padding:16px 16px 40px}.hero{background:#fffaff;border:2px solid #e8cdea;border-radius:28px;padding:24px 22px 18px;box-shadow:0 8px 28px #bda9d51a}.hero-title{font-size:13px;letter-spacing:.16em;color:#9478a6;font-weight:800}.hero-main{display:flex;justify-content:space-between;align-items:end;margin:22px 0 14px}.hero-count{font-size:36px;font-weight:800;color:#c48bc3}.hero-count span{font-size:20px;color:#776b82;font-weight:600}.percent{font-size:14px;color:#9284a0}.progress{height:9px;background:#eee4f4;border-radius:20px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#d9a9d9,#b9c8ef);border-radius:20px}.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid #eadff0;margin-top:16px;padding-top:15px;text-align:center}.hero-stat b{font-size:22px}.hero-stat span{font-size:11px;color:#91849c;margin-left:5px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;background:#fff;border:1px solid #e6deef;border-radius:24px;padding:6px;margin:18px 0}.tab{background:transparent;color:#8f82a2;padding:14px 7px;border-radius:17px;font-weight:800;border:0;font-size:15px}.tab.active{background:linear-gradient(90deg,#e8afd1,#c8b8eb);color:#fff;box-shadow:0 5px 12px #c8b7e833}
.subtabs{display:flex;gap:5px;align-items:center;background:#fff;border:1px solid #e6deef;border-radius:19px;padding:5px;margin-bottom:14px;overflow-x:auto}.set-add{flex:0 0 42px;height:42px;border:0;border-radius:14px;background:#eee1f6;color:#9b78b4;font-size:24px;font-weight:800}.subtabs::-webkit-scrollbar{display:none}.subtab{flex:1;padding:12px 8px;border:0;background:transparent;border-radius:15px;color:#81768f;font-weight:700}.subtab.active{background:#eee1f6;color:#9b78b4}
.searchrow{display:flex;gap:8px;margin-bottom:12px}.search{flex:1;padding:15px 16px;border:1px solid #e4dced;border-radius:18px;background:#fff;font-size:14px;outline:none}.filterbtn{width:58px;border-radius:18px;border:2px solid #d9b7df;background:#fff;color:#b27eb7;font-size:21px}.filters{background:#fff;border-radius:23px;padding:18px 14px;margin-bottom:14px;border:1px solid #e6deef;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.field label{display:block;font-size:13px;margin-bottom:7px;color:#5c5366}.select{width:100%;padding:12px 10px;border:1px solid #e3dced;border-radius:13px;background:#fff;color:#625a6d}.clear{grid-column:1/-1;justify-self:start;padding:10px 18px;border:0;border-radius:16px;background:#f6edf8;color:#8d789d}
.listhead{display:flex;justify-content:space-between;align-items:center;color:#91849e;font-size:13px;margin:18px 4px 9px}.cardsort{border:0;background:transparent;color:#91849e}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 5px 18px #b8acd522;border:1px solid #eee4f1;position:relative}.card img{width:100%;aspect-ratio:3/4;object-fit:cover;background:#f4edf6}.placeholder{aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;color:#afa4ba;background:#f5f0f9;font-size:12px;text-align:center}.info{padding:10px}.name{font-weight:800;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:10px;color:#9b90a8;margin-top:4px;line-height:1.5}.fav{position:absolute;right:8px;top:8px;width:34px;height:34px;padding:0;border-radius:50%;background:#ffffffdd;color:#bca8ca;font-size:18px;border:0}.fav.on{color:#d39bc5}.empty{text-align:center;padding:45px 20px;color:#a49ab0;font-size:13px;grid-column:1/-1}
.page{display:none}.page.active{display:block}.add{width:100%;padding:14px;background:linear-gradient(90deg,#e3b0d1,#cbb9e8);font-size:14px;margin:12px 0 14px;border:0;border-radius:17px;color:#fff;font-weight:800}.coordgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.coord{background:#fff;border:1px solid #e6deef;border-radius:20px;padding:16px}.coord h3{margin:0 0 8px}.coord button{background:#eee1f6;color:#9676ad;border:0;border-radius:12px;padding:9px 12px;font-weight:700}.history{background:#fff;border-radius:20px;border:1px solid #e6deef;overflow:hidden}.history-item{padding:14px 16px;border-bottom:1px solid #f1e5ef;display:flex;gap:10px;align-items:center}.history-item:last-child{border-bottom:0}.history-dot{width:10px;height:10px;background:#e33b91;border-radius:50%}
dialog{border:0;border-radius:22px;padding:0;width:min(92vw,500px);box-shadow:0 20px 60px #55445a55}dialog::backdrop{background:#342a3855;backdrop-filter:blur(3px)}.modal{padding:20px}.modal h2{margin:0 0 15px;font-size:20px}.field{margin:10px 0}.field label{display:block;font-size:11px;color:#8f8194;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #e4d8e8;border-radius:11px;font:inherit}.field textarea{min-height:70px;resize:vertical}.preview{width:100%;aspect-ratio:3/4;object-fit:contain;background:#f5f0f9;border-radius:12px;margin-bottom:10px}.actions{display:flex;gap:8px;margin-top:15px}.actions button{flex:1;border:0;border-radius:13px;padding:12px;background:#cbb2e5;color:#fff;font-weight:800}.actions .cancel{background:#eeeaf2;color:#716878}
@media(min-width:600px){.grid{grid-template-columns:repeat(4,1fr)}}@media(max-width:620px){.filters{grid-template-columns:repeat(2,1fr)}.hero-main{align-items:center}.coordgrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="logo">🎀</div><div class="headtext"><div class="eyebrow">COLLECTION</div><h1>カード帳 ✦</h1></div><button class="gear" id="settingsBtn" title="設定">⚙</button></header>
<main class="wrap">
<section class="hero"><div class="hero-title" id="heroTitle">AIKATSU! ENCORE · 1弾</div><div class="hero-main"><div class="hero-count"><span id="ownedTypes">0</span><span id="totalLabel"> / 85種</span></div><div class="percent" id="percent">0% collected</div></div><div class="progress"><div class="bar" id="bar"></div></div><div class="hero-stats"><div class="hero-stat"><b id="owned">0</b><span>総枚数</span></div><div class="hero-stat"><b id="registered">0</b><span>登録カード</span></div><div class="hero-stat"><b id="favorites">0</b><span>お気に入り</span></div></div></section>
<nav class="tabs"><button class="tab active" data-page="cardsPage">♡カード</button><button class="tab" data-page="coordPage">♤コーデ</button><button class="tab" data-page="savePage">♣︎セーブデータ</button><button class="tab" data-page="historyPage">♢履歴</button></nav>
<section id="cardsPage" class="page active">
<div class="subtabs" id="setTabs"><button class="subtab active" data-set="first">1弾</button><button class="subtab" data-set="promo">プロモカード</button><button class="subtab" data-set="set2">2弾</button><button class="subtab" data-set="set3">3弾</button><button class="set-add" id="addSet" title="弾を追加">＋</button></div>
<div class="searchrow"><input id="search" class="search" placeholder="⌕ カード番号・登録した名前で検索"><button id="filterBtn" class="filterbtn">☷</button></div>
<div id="filters" class="filters">
<div class="field"><label>タイプ</label><select id="typeFilter" class="select"><option value="all">すべて</option><option>キュート</option><option>クール</option><option>セクシー</option><option>ポップ</option></select></div>
<div class="field"><label>カテゴリー</label><select id="categoryFilter" class="select"><option value="all">すべて</option><option>トップス</option><option>ボトムス</option><option>シューズ</option><option>トップス＆ボトムス</option><option>フルコーデ</option><option>アクセサリー</option></select></div>
<div class="field"><label>ブランド</label><select id="brandFilter" class="select"><option value="all">すべて</option></select></div>
<div class="field"><label>レアリティ</label><select id="rarityFilter" class="select"><option value="all">すべて</option><option>ノーマル</option><option>レア</option><option>プレミアムレア</option><option>アンコールレア</option><option>その他</option></select></div>
<div class="field"><label>所持状況</label><select id="statusFilter" class="select"><option value="all">すべて</option><option value="owned">所持</option><option value="unowned">未所持</option></select></div>
<button id="clearFilters" class="clear">クリア</button></div>
<button class="add" id="addBtn">＋ カードを追加</button>
<div class="listhead"><span id="listCount">85種類・1弾</span><select id="sort" class="cardsort"><option value="number">カード番号順</option><option value="new">登録が新しい順</option><option value="name">名前順</option><option value="qty">所持枚数順</option></select></div>
<section class="grid" id="grid"></section>
</section>
<section id="coordPage" class="page"><button class="add" id="addCoord">＋ コーデを作成</button><div id="coordGrid" class="coordgrid"></div></section>
<section id="savePage" class="page"><div class="coord"><h3>💾 バックアップ</h3><p class="meta">「書き出す」で出た文字列をメモなどに保存しておくと、「読み込む」で復元できます。</p><textarea id="backupText" style="width:100%;min-height:90px;margin:8px 0;border:1px solid #e4d8e8;border-radius:11px;padding:8px"></textarea><div style="display:flex;gap:8px;flex-wrap:wrap"><button id="exportBtn">書き出す</button><button id="importBtn">読み込む</button></div></div></section>
<section id="historyPage" class="page"><div id="history" class="history"></div></section>
</main>
<dialog id="settingsDlg"><div class="modal"><h2>弾の設定 ⚙️</h2><div class="field"><label>対象の弾</label><select id="settingsSet"></select></div><div class="field"><label>この弾の総種類数</label><input id="settingsTotal" type="number" min="0" placeholder="例：85"></div><div class="actions"><button class="cancel" id="settingsCancel">キャンセル</button><button id="settingsSave">保存する</button></div></div></dialog>
<dialog id="dlg"><div class="modal"><h2>カードを登録 ✨</h2><img id="preview" class="preview" style="display:none"><div class="field"><label>カード画像</label><input id="photo" type="file" accept="image/*"></div><div class="field"><label>カード番号</label><input id="number" placeholder="例：01-001"></div><div class="field"><label>カード名</label><input id="name" placeholder="例：○○コーデ"></div><div class="field"><label>レアリティ</label><select id="rarity"><option>ノーマル</option><option>レア</option><option>プレミアムレア</option><option>アンコールレア</option><option>その他</option></select></div><div class="field"><label>ブランド</label><input id="brand" placeholder="ブランド名"></div><div class="field"><label>タイプ</label><select id="ctype"><option>キュート</option><option>クール</option><option>セクシー</option><option>ポップ</option></select></div><div class="field"><label>カテゴリー</label><select id="part"><option>トップス</option><option>ボトムス</option><option>シューズ</option><option>トップス＆ボトムス</option><option>フルコーデ</option><option>アクセサリー</option></select></div><div class="field"><label>カードの種類</label><select id="setType"></select></div><div class="field"><label>所持枚数</label><input id="qty" type="number" min="0" value="1"></div><div class="field"><label>メモ</label><textarea id="memo" placeholder="入手場所など"></textarea></div><div class="actions"><button class="cancel" id="cancel">キャンセル</button><button id="save">登録する</button></div></div></dialog>
<script>
const KEY="aikatsu_encore_cards_v2";
let sets=JSON.parse(localStorage.getItem(KEY+"_sets")||"null")||[{id:"first",label:"1弾",total:85},{id:"promo",label:"プロモカード",total:null},{id:"set2",label:"2弾",total:null},{id:"set3",label:"3弾",total:null}];
let cards=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem("aikatsu_encore_cards_v1")||"[]");let imageData="";let currentSet="first";let history=JSON.parse(localStorage.getItem(KEY+"_history")||"[]");const $=id=>document.getElementById(id);
const addHistory=(text)=>{history.unshift({text,time:new Date().toLocaleString("ja-JP")});history=history.slice(0,30);localStorage.setItem(KEY+"_history",JSON.stringify(history));};
$("addBtn").onclick=()=>{resetForm();$("dlg").showModal()};$("cancel").onclick=()=>$("dlg").close();
$("photo").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{imageData=r.result;$("preview").src=imageData;$("preview").style.display="block"};r.readAsDataURL(f)};
$("save").onclick=()=>{const c={id:Date.now(),number:$("number").value.trim(),image:imageData,name:$("name").value.trim()||"名前なしカード",rarity:$("rarity").value,brand:$("brand").value.trim()||"未設定",part:$("part").value,qty:Math.max(0,Number($("qty").value)||0),memo:$("memo").value.trim(),set:$("setType").value,fav:false,category:$("part").value,type:$("ctype").value};cards.unshift(c);addHistory(`「${c.name}」を登録`);save();$("dlg").close()};
$("search").oninput=render;["typeFilter","categoryFilter","brandFilter","rarityFilter","statusFilter","sort"].forEach(id=>$(id).onchange=render);$("clearFilters").onclick=()=>{["typeFilter","categoryFilter","brandFilter","rarityFilter","statusFilter"].forEach(id=>$(id).value="all");$("search").value="";render()};
$("filterBtn").onclick=()=>$("filters").scrollIntoView({behavior:"smooth",block:"center"});
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));$(b.dataset.page).classList.add("active");if(b.dataset.page==="historyPage")renderHistory();if(b.dataset.page==="coordPage")renderCoords()});
function renderSetTabs(){
  const wrap=$("setTabs");
  const add=$("addSet");
  wrap.querySelectorAll(".subtab").forEach(x=>x.remove());
  sets.forEach(st=>{const b=document.createElement("button");b.className="subtab"+(st.id===currentSet?" active":"");b.dataset.set=st.id;b.textContent=st.label;b.onclick=()=>{currentSet=st.id;renderSetTabs();resetFiltersForSet();render()};wrap.insertBefore(b,add)});
}
function resetFiltersForSet(){$("search").value="";["typeFilter","categoryFilter","brandFilter","rarityFilter","statusFilter"].forEach(id=>$(id).value="all")}
function updateSetTypeOptions(){const sel=$("setType"),v=sel.value;sel.innerHTML=sets.map(st=>`<option value="${esc(st.id)}">${esc(st.label)}</option>`).join("");sel.value=sets.some(st=>st.id===v)?v:currentSet}
$("addSet").onclick=()=>{const n=sets.length+1;const label=prompt("追加する弾の名前",n+"弾");if(!label||!label.trim())return;const totalText=prompt("この弾は全部で何種類？（あとから変更できます）","");const total=totalText!==null&&totalText.trim()!==""?Math.max(0,Number(totalText)||0):null;const id="set"+Date.now();sets.push({id,label:label.trim(),total});currentSet=id;renderSetTabs();updateSetTypeOptions();save()};

$("settingsBtn").onclick=()=>{const sel=$("settingsSet");sel.innerHTML=sets.map(st=>`<option value="${esc(st.id)}">${esc(st.label)}</option>`).join("");sel.value=currentSet;const st=sets.find(x=>x.id===currentSet)||sets[0];$("settingsTotal").value=st.total??"";$('settingsDlg').showModal()};
$("settingsSet").onchange=()=>{const st=sets.find(x=>x.id===$("settingsSet").value);$("settingsTotal").value=st&&st.total!=null?st.total:""};
$("settingsCancel").onclick=()=>$("settingsDlg").close();
$("settingsSave").onclick=()=>{const st=sets.find(x=>x.id===$("settingsSet").value);if(!st)return;const v=$("settingsTotal").value.trim();st.total=v===""?null:Math.max(0,Number(v)||0);currentSet=st.id;renderSetTabs();save();$("settingsDlg").close()};
function resetForm(){updateSetTypeOptions();imageData="";$("preview").style.display="none";["number","name","brand","memo"].forEach(x=>$(x).value="");$("qty").value=1;$("rarity").selectedIndex=0;$("part").selectedIndex=0;$("ctype").selectedIndex=0;$("setType").value=currentSet;$("photo").value=""}
function save(){localStorage.setItem(KEY,JSON.stringify(cards));localStorage.setItem(KEY+"_sets",JSON.stringify(sets));render();updateBrands()}
function updateBrands(){const brands=[...new Set(cards.map(c=>c.brand).filter(Boolean))];const sel=$("brandFilter"),v=sel.value;sel.innerHTML='<option value="all">すべて</option>'+brands.map(b=>`<option>${esc(b)}</option>`).join("");if(brands.includes(v))sel.value=v}
function render(){const q=$("search").value.toLowerCase();let list=cards.filter(c=>(c.set||"first")==currentSet&&(c.name+c.brand+c.rarity+c.part+c.number).toLowerCase().includes(q));const vals={type:$("typeFilter").value,cat:$("categoryFilter").value,brand:$("brandFilter").value,rarity:$("rarityFilter").value,status:$("statusFilter").value};if(vals.type!=="all")list=list.filter(c=>c.type===vals.type);if(vals.cat!=="all")list=list.filter(c=>c.category===vals.cat);if(vals.brand!=="all")list=list.filter(c=>c.brand===vals.brand);if(vals.rarity!=="all")list=list.filter(c=>c.rarity===vals.rarity);if(vals.status==="owned")list=list.filter(c=>c.qty>0);if(vals.status==="unowned")list=list.filter(c=>c.qty===0);const s=$("sort").value;if(s==="new")list.sort((a,b)=>b.id-a.id);if(s==="name")list.sort((a,b)=>a.name.localeCompare(b.name,"ja"));if(s==="qty")list.sort((a,b)=>b.qty-a.qty);if(s==="number")list.sort((a,b)=>(a.number||"").localeCompare(b.number||"",undefined,{numeric:true}));
const current=sets.find(st=>st.id===currentSet)||sets[0];const inSet=cards.filter(c=>(c.set||"first")===currentSet);const ownedTypes=inSet.filter(c=>c.qty>0).length;const totalQty=inSet.reduce((a,c)=>a+c.qty,0);const denom=current.total||Math.max(ownedTypes,inSet.length,1);const pct=current.total?Math.min(100,ownedTypes/current.total*100):0;$("ownedTypes").textContent=ownedTypes;$("owned").textContent=totalQty;$("registered").textContent=inSet.length;$("favorites").textContent=inSet.filter(c=>c.fav).length;$("percent").textContent=Math.round(pct)+"% collected";$("bar").style.width=pct+"%";$("listCount").textContent=(current.total?current.total+"種類・":"")+current.label;$("heroTitle").textContent="AIKATSU! ENCORE · "+current.label;$("totalLabel").textContent=current.total?" / "+current.total+"種":" 種";
$("grid").innerHTML=list.length?list.map(c=>`<article class="card">${c.image?`<img src="${c.image}" alt="">`:`<div class="placeholder">📷<br>画像なし</div>`}<button class="fav ${c.fav?'on':''}" onclick="toggleFav(${c.id})">${c.fav?'♥':'♡'}</button><div class="info"><div class="name">${esc(c.number?c.number+" · ":"")+esc(c.name)}</div><div class="meta">${esc(c.rarity)} ・ ${esc(c.part)}<br>${esc(c.brand)} ・ ${c.qty}枚</div></div></article>`).join(""):`<div class="empty">まだカードがありません。<br>「＋ カードを追加」から登録してね 🎀</div>`}
function toggleFav(id){const c=cards.find(x=>x.id===id);c.fav=!c.fav;addHistory(`「${c.name}」を${c.fav?'お気に入り登録':'お気に入り解除'}`);save()}
function renderHistory(){$("history").innerHTML=history.length?history.map(h=>`<div class="history-item"><span class="history-dot"></span><div><b>${esc(h.text)}</b><div class="meta">${esc(h.time)}</div></div></div>`).join(""): '<div class="empty" style="grid-column:auto">まだ履歴がありません。</div>'}
function renderCoords(){$("coordGrid").innerHTML='<div class="coord"><h3>🌟 マイコーデ</h3><p class="meta">登録したカードからお気に入りコーデを作ろう。</p><button onclick="coordMsg()">コーデを作る</button></div><div class="coord"><h3>♡ お気に入りカード</h3><p class="meta">お気に入り登録したカード：'+cards.filter(c=>c.fav).length+'枚</p></div>'}
function coordMsg(){alert("コーデ作成機能は準備中だよ🎀")}
$("addCoord").onclick=coordMsg;
$("exportBtn").onclick=()=>{$("backupText").value=JSON.stringify({cards,sets});$("backupText").select()};
$("importBtn").onclick=()=>{try{const d=JSON.parse($("backupText").value);if(!Array.isArray(d.cards)||!Array.isArray(d.sets))throw 0;if(!confirm("今のデータを上書きして読み込む？"))return;cards=d.cards;sets=d.sets;currentSet=sets[0].id;addHistory("バックアップを読み込み");renderSetTabs();updateSetTypeOptions();save()}catch(_){alert("読み込めないデータです")}};
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
renderSetTabs();updateSetTypeOptions();updateBrands();render();
</script>
</body>
</html>
